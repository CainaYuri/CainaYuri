name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 0 * * *"   # atualiza todo dia à meia-noite (UTC)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar os SVGs da cobrinha em tons de azul
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1E40AF&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#161b22,#0c2d6b,#1e40af,#3b82f6,#93c5fd

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
